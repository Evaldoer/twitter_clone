<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Twitter Clone{% endblock %}</title>
    {% load static %}

    <!-- Bootstrap via CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <!-- CSS customizado -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">

            <!-- Logo -->
            <a class="navbar-brand" href="{% url 'feed' %}">
                Twitter Clone
            </a>

            <!-- Botão mobile -->
            <button
              class="navbar-toggler"
              type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navbarNav"
            >
              <span class="navbar-toggler-icon"></span>
            </button>

            <!-- Links -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">

                    {% if user.is_authenticated %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'feed' %}">
                                Feed
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'profile' user.username %}">
                                Perfil
                            </a>
                        </li>

                        <!-- Username visível -->
                        <li class="nav-item">
                            <span class="nav-link text-info fw-semibold">
                                @{{ user.username }}
                            </span>
                        </li>

                        <!-- Logout seguro -->
                        <li class="nav-item">
                            <form
                              method="post"
                              action="{% url 'logout' %}"
                              class="d-inline"
                            >
                                {% csrf_token %}
                                <button
                                  type="submit"
                                  class="btn btn-link nav-link text-warning p-0"
                                >
                                    Sair
                                </button>
                            </form>
                        </li>

                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'login' %}">
                                Login
                            </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link text-success" href="{% url 'register' %}">
                                Registrar
                            </a>
                        </li>
                    {% endif %}

                </ul>
            </div>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container flex-fill">
        {% block content %}{% endblock %}
    </main>

    <!-- Rodapé -->
    <footer class="bg-dark text-light text-center py-3 mt-4">
        <p class="mb-0">
            &copy; <span id="current-year"></span> - Twitter Clone
        </p>
    </footer>

    <!-- Ano automático -->
    <script>
        document.getElementById("current-year").textContent =
            new Date().getFullYear();
    </script>

    <!-- Bootstrap JS -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
    </script>

</body>
</html>
